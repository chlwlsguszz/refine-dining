<svg id="data-root" xmlns="http://www.w3.org/2000/svg" width="1200" height="1220" viewBox="0 0 1200 1220" role="img" aria-labelledby="data-title data-desc">
  <title id="data-title">Refine Dining 데이터 준비 아키텍처</title>
  <desc id="data-desc">기존 규칙 정제, 원문과 근거를 이용한 식품 매칭 및 검수, USDA 실측 수율 준비를 세 개의 경로로 표시합니다. Qwen 판정은 별도 실험 기록이며 검수 제안을 자동 승인하지 않습니다. 중량 자료는 Spring과 Python이 각각 읽습니다.</desc>
  <defs>
    <marker id="data-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#b94f16"/></marker>
    <marker id="data-muted-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#8c7868"/></marker>
    <style>
      #data-root text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#352b25} .data-title{font-size:28px;font-weight:750;letter-spacing:-.5px}#data-root .data-subtitle{font-size:16px;fill:#746355}#data-root .data-lane-title{font-size:19px;font-weight:700;fill:#954512}.data-node-title{font-size:18px;font-weight:700}#data-root .data-body{font-size:16px;fill:#746355}#data-root .data-code{font-size:16px;font-family:ui-monospace,Consolas,monospace;fill:#954512}#data-root .data-label{font-size:16px;fill:#954512}#data-root .data-note{font-size:16px;fill:#746355}.data-node{fill:#fff;stroke:#dfc5ae;stroke-width:1.4}.data-output{fill:#fff0df;stroke:#d9af8c;stroke-width:1.4}.data-lane{fill:#fffdf9;stroke:#eedfce;stroke-width:1.2}.data-edge{fill:none;stroke:#b94f16;stroke-width:2;stroke-linejoin:round;marker-end:url(#data-arrow)}.data-experiment{fill:none;stroke:#8c7868;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#data-muted-arrow)}
    </style>
  </defs>
  <rect width="1200" height="1220" fill="#fffaf5"/>
  <text x="40" y="48" class="data-title">데이터는 어떻게 서비스에 들어오는가</text>
  <text x="40" y="80" class="data-subtitle">사전 처리 · 원본 보존 · 사람의 검수 · 서비스 시작 시 적재</text>
