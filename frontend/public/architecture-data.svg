  <text x="50" y="776" class="data-note"><tspan x="50">RAG 검수 결과를 이 테이블에</tspan><tspan x="50" dy="25">자동 반영하는 연결은</tspan><tspan x="50" dy="25">현재 구현되어 있지 않습니다.</tspan></text>

