spring:
  web:
    resources:
      static-locations: file:../frontend/dist/
  datasource:
    url: ${RAG_JDBC_URL:jdbc:h2:file:./build/rag/demo;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
logging:
  level:
    org.hibernate.SQL: WARN
public-data:
  api-key: ""
gemini:
  api-key: ""
server:
  address: 127.0.0.1
  port: ${RAG_PORT:18082}
rag:
  catalog: ${RAG_CATALOG:./build/rag/catalog.json}
  proposals: ${RAG_PROPOSALS:../datasets/week1/2026-11-10/local-rag/development.json}
